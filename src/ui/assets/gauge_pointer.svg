<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="title desc">
  <title id="title">Chicago Express round gauge pointer</title>
  <desc id="desc">A classic board-game gauge needle pointing upward, with a circular pivot.</desc>
  <defs>
    <linearGradient id="needleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f1d1d"/>
      <stop offset="0.48" stop-color="#d4473f"/>
      <stop offset="1" stop-color="#7c1717"/>
    </linearGradient>
    <linearGradient id="hubFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e7bd"/>
      <stop offset="1" stop-color="#b98b4b"/>
    </linearGradient>
  </defs>
  <!-- Needle -->
  <path d="M50 7 L59 61 L50 70 L41 61 Z"
        fill="url(#needleFill)" stroke="#3a211b" stroke-width="2.5"
        stroke-linejoin="round"/>
  <!-- Subtle center highlight -->
  <path d="M50 15 L53 59 L50 63 Z" fill="#ffffff" opacity="0.22"/>
  <!-- Pivot bezel -->
  <circle cx="50" cy="66" r="10.5" fill="#30251e" stroke="#17120f" stroke-width="1.5"/>
  <circle cx="50" cy="66" r="7.5" fill="url(#hubFill)" stroke="#6e4d2b" stroke-width="1.2"/>
  <circle cx="47.5" cy="63.5" r="2" fill="#fff7df" opacity="0.85"/>
</svg>
